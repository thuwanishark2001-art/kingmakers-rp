plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }

    compileSdk 34
    defaultConfig {
        minSdkVersion 26
        targetSdkVersion 34

        namespace 'com.russia.game'
        applicationId "com.russia.game"
        versionName "1.0.0"
        versionCode 1
        manifestPlaceholders = [appName: "Kingmakers RP"]

        multiDexEnabled = true

        lintOptions {
            checkReleaseBuilds false
            abortOnError false
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }


    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/libbass.so', '**/libbass_ssl.so', '**/libc++_shared.so', '**/libGTASA.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
        pickFirst '**/libbass.so'
        pickFirst '**/libbass_ssl.so'
        pickFirst '**/libc++_shared.so'
    }

    // Release signing comes from the environment (GitHub Actions secrets in CI).
    // Never commit the keystore or its passwords. Without these variables the
    // release build is left unsigned and CI signs it afterwards.
    def releaseKeystore = System.getenv("ANDROID_KEYSTORE_FILE")
    def hasReleaseSigning = releaseKeystore && file(releaseKeystore).exists()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    ndkVersion '26.1.10909125'

    // Kingmakers content ships in the install-time asset pack ":game" (split_game.apk)
    assetPacks = [":game"]

    androidResources {
        noCompress 'mp3'
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
        debug {
            externalNativeBuild {
                cmake {
                    cppFlags '-g'
                }
            }

            debuggable true
            minifyEnabled false
            jniDebuggable false
            renderscriptDebuggable false
        }
    }
    viewBinding {
        enabled = true
    }

    buildFeatures {
        prefab true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'com.bytedance.android:shadowhook:1.0.10'
    implementation 'com.airbnb.android:lottie:6.4.0'
    implementation 'com.github.rommansabbir:AnimationX:2.0'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.2'

    implementation 'com.google.android.material:material:1.12.0'
    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
    implementation "com.github.skydoves:progressview:1.1.3"
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'

    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.github.valkriaine:Bouncy:2.3'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'
    implementation "com.github.skydoves:colorpickerview:2.3.0"
}