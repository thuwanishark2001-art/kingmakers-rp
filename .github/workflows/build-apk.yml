name: Build Kingmakers RP Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Fetch Precompiled RenderWare Engine Binaries
        run: |
          mkdir -p android-client/app/src/main/jniLibs
          git clone --depth 1 --filter=blob:none --sparse https://github.com/noobcooder-sys/SA-MP-Mobile-Client-GTA-SA-2.10- /tmp/upstream_libs
          cd /tmp/upstream_libs
          git sparse-checkout set app/src/main/jniLibs
          git checkout
          cd -
          cp -r /tmp/upstream_libs/app/src/main/jniLibs/* android-client/app/src/main/jniLibs/
          ls -la android-client/app/src/main/jniLibs/arm64-v8a/

      - name: Restore Release Keystore from Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Repository secret $v is not set. Add it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build Standalone APK & App Bundle
        working-directory: android-client
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build_log.txt || {
            echo "## ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B 5 -A 25 "FAILURE:" /tmp/build_log.txt >> $GITHUB_STEP_SUMMARY || tail -n 80 /tmp/build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Generate Split APK Bundle (Grand Mobile Architecture)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p build-out/split_apks /tmp/extracted_splits
          
          # 1. Android App Bundle (.aab) - includes the ":game" install-time asset pack
          cp android-client/app/build/outputs/bundle/release/*.aab build-out/Kingmakers_RP_AppBundle_v1.0.aab
          
          # 3. Download Google Bundletool and Uber APK Signer
          curl -sSL https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o /tmp/bundletool.jar
          curl -sSL https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o /tmp/uber-apk-signer.jar
          
          # 4. Release keystore restored from repository secrets
          KEYSTORE="$ANDROID_KEYSTORE_FILE"
          
          # 5. Build .apks (Split APKs archive)
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=build-out/Kingmakers_RP_AppBundle_v1.0.aab \
            --output=build-out/Kingmakers_RP_Split_Bundle_v1.0.apks \
            --mode=default \
            --ks="$KEYSTORE" \
            --ks-pass="pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass="pass:$ANDROID_KEY_PASSWORD"

          # 5b. Monolithic Standalone APK from the bundle (universal mode merges the
          #     "game" asset pack in; assembleRelease would leave it out)
          java -jar /tmp/bundletool.jar build-apks \
            --bundle=build-out/Kingmakers_RP_AppBundle_v1.0.aab \
            --output=/tmp/universal.apks \
            --mode=universal \
            --ks="$KEYSTORE" \
            --ks-pass="pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias="$ANDROID_KEY_ALIAS" \
            --key-pass="pass:$ANDROID_KEY_PASSWORD"
          unzip -p /tmp/universal.apks universal.apk > build-out/Kingmakers_RP_Standalone_v1.0.apk
            
          # 6. Unpack splits and structure into Grand Mobile RP schema
          unzip -q build-out/Kingmakers_RP_Split_Bundle_v1.0.apks -d /tmp/extracted_splits
          python3 backend/tools/package_grand_splits.py /tmp/extracted_splits build-out/split_apks /tmp/temp_splits.zip
          
          # 7. Sign Monolithic Standalone APK and all individual split APKs (v1, v2, v3 schemes + zipalign)
          java -jar /tmp/uber-apk-signer.jar \
            -a build-out/Kingmakers_RP_Standalone_v1.0.apk build-out/split_apks/*.apk \
            --ks "$KEYSTORE" \
            --ksAlias "$ANDROID_KEY_ALIAS" \
            --ksPass "$ANDROID_KEYSTORE_PASSWORD" \
            --ksKeyPass "$ANDROID_KEY_PASSWORD" \
            --allowResign \
            --overwrite \
            --verbose
            
          # 8. Thoroughly verify all signed packages
          java -jar /tmp/uber-apk-signer.jar -y \
            -a build-out/Kingmakers_RP_Standalone_v1.0.apk build-out/split_apks/*.apk \
            --verbose
            
          # 9. Pack final Grand Mobile RP split zip bundles from verified signed splits
          (cd build-out/split_apks && zip -q -r ../Kingmakers_RP_Split_APKs_v1.0.zip ./*.apk)
          cp build-out/Kingmakers_RP_Split_APKs_v1.0.zip build-out/apks.zip
          
          ls -lh build-out/

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kingmakers_RP_Mobile_Distribution_v1.0
          path: build-out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-standalone -y 2>/dev/null || true
          git tag -d v1.0.0-standalone 2>/dev/null || true
          git push origin :refs/tags/v1.0.0-standalone 2>/dev/null || true
          gh release create v1.0.0-standalone \
            build-out/Kingmakers_RP_Standalone_v1.0.apk \
            build-out/Kingmakers_RP_Split_Bundle_v1.0.apks \
            build-out/Kingmakers_RP_Split_APKs_v1.0.zip \
            build-out/apks.zip \
            build-out/Kingmakers_RP_AppBundle_v1.0.aab \
            --title "Kingmakers RP Standalone & Grand Mobile Split APK Bundle v1.0.0" \
            --notes "Kingmakers RP distribution packages: Standalone APK, Google App Bundle (.aab), Bundletool Split APKs (.apks), and Grand Mobile RP compatible Split APKs archive (apks.zip). Direct VPS connection to 139.180.185.57:7777."

      - name: Deploy Distribution Files to Repository Downloads
        run: |
          git checkout main
          git pull --rebase origin main || true
          mkdir -p backend/public/downloads
          cp build-out/Kingmakers_RP_Standalone_v1.0.apk backend/public/downloads/Kingmakers_RP_Standalone_v1.0.apk
          cp build-out/Kingmakers_RP_Standalone_v1.0.apk backend/public/downloads/Kingmakers_RP_Launcher_v1.0.apk
          cp build-out/Kingmakers_RP_Split_APKs_v1.0.zip backend/public/downloads/Kingmakers_RP_Split_APKs_v1.0.zip
          cp build-out/apks.zip backend/public/downloads/apks.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/public/downloads/Kingmakers_RP_Standalone_v1.0.apk \
                  backend/public/downloads/Kingmakers_RP_Launcher_v1.0.apk \
                  backend/public/downloads/Kingmakers_RP_Split_APKs_v1.0.zip \
                  backend/public/downloads/apks.zip || true
          git commit -m "feat(release): publish Standalone and Grand Mobile Split APK bundles v1.0.0 [skip ci]" || true
          git push origin main || true

      - name: Save Build Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          mkdir -p logs
          tail -n 2000 /tmp/build_log.txt > logs/last_build_error.txt 2>/dev/null || true
          grep -n -C 5 -E "FAILED:|error:|CMake Error" /tmp/build_log.txt > logs/errors_summary.txt 2>/dev/null || true
          git add logs/
          git commit -m "chore: save build log [skip ci]" || true
          git push -f origin build-logs || true
