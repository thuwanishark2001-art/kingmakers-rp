name: Build Kingmakers RP Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Fetch Precompiled RenderWare Engine Binaries
        run: |
          mkdir -p android-client/app/src/main/jniLibs
          git clone --depth 1 --filter=blob:none --sparse https://github.com/noobcooder-sys/SA-MP-Mobile-Client-GTA-SA-2.10- /tmp/upstream_libs
          cd /tmp/upstream_libs
          git sparse-checkout set app/src/main/jniLibs
          git checkout
          cd -
          cp -r /tmp/upstream_libs/app/src/main/jniLibs/* android-client/app/src/main/jniLibs/
          ls -la android-client/app/src/main/jniLibs/arm64-v8a/

      - name: Build Standalone APK
        working-directory: android-client
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build_log.txt || {
            echo "## ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B 5 -A 25 "FAILURE:" /tmp/build_log.txt >> $GITHUB_STEP_SUMMARY || tail -n 80 /tmp/build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare Standalone APK
        run: |
          mkdir -p build-out
          cp android-client/app/build/outputs/apk/release/*.apk build-out/Kingmakers_RP_Standalone_v1.0.apk
          ls -lh build-out/Kingmakers_RP_Standalone_v1.0.apk

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kingmakers_RP_Standalone_v1.0
          path: build-out/Kingmakers_RP_Standalone_v1.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-standalone -y 2>/dev/null || true
          git tag -d v1.0.0-standalone 2>/dev/null || true
          git push origin :refs/tags/v1.0.0-standalone 2>/dev/null || true
          gh release create v1.0.0-standalone build-out/Kingmakers_RP_Standalone_v1.0.apk \
            --title "Kingmakers RP Standalone APK v1.0.0" \
            --notes "Standalone Mobile Client with integrated RenderWare 3D Engine (libGTASA.so + libmultiplayer.so). Direct VPS connection to 139.180.185.57:7777."

      - name: Deploy Standalone APK to Repository Downloads
        run: |
          git checkout main
          mkdir -p backend/public/downloads
          cp build-out/Kingmakers_RP_Standalone_v1.0.apk backend/public/downloads/Kingmakers_RP_Standalone_v1.0.apk
          cp build-out/Kingmakers_RP_Standalone_v1.0.apk backend/public/downloads/Kingmakers_RP_Launcher_v1.0.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/public/downloads/
          git commit -m "feat(release): publish compiled Standalone APK v1.0.0 [skip ci]" || true
          git push origin main || true

      - name: Save Build Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          mkdir -p logs
          tail -n 2000 /tmp/build_log.txt > logs/last_build_error.txt 2>/dev/null || true
          grep -n -C 5 -E "FAILED:|error:|CMake Error" /tmp/build_log.txt > logs/errors_summary.txt 2>/dev/null || true
          git add logs/
          git commit -m "chore: save build log [skip ci]" || true
          git push -f origin build-logs || true
