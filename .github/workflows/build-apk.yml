name: Build Kingmakers RP Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Fetch Precompiled RenderWare Engine Binaries
        run: |
          mkdir -p android-client/app/src/main/jniLibs
          git clone --depth 1 --filter=blob:none --sparse https://github.com/noobcooder-sys/SA-MP-Mobile-Client-GTA-SA-2.10- /tmp/upstream_libs
          cd /tmp/upstream_libs
          git sparse-checkout set app/src/main/jniLibs
          git checkout
          cd -
          cp -r /tmp/upstream_libs/app/src/main/jniLibs/* android-client/app/src/main/jniLibs/
          ls -la android-client/app/src/main/jniLibs/arm64-v8a/

      - name: Build Standalone APK
        working-directory: android-client
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build_log.txt || {
            echo "## ❌ Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -B 5 -A 25 "FAILURE:" /tmp/build_log.txt >> $GITHUB_STEP_SUMMARY || tail -n 80 /tmp/build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare Standalone APK
        run: |
          mkdir -p build-out
          cp android-client/app/build/outputs/apk/debug/*.apk build-out/Kingmakers_RP_Standalone_v1.0.apk
          ls -lh build-out/Kingmakers_RP_Standalone_v1.0.apk

      - name: Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kingmakers_RP_Standalone_v1.0
          path: build-out/Kingmakers_RP_Standalone_v1.0.apk
          if-no-files-found: error

      - name: Save Build Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          mkdir -p logs
          tail -n 250 /tmp/build_log.txt > logs/last_build_error.txt
          git add logs/last_build_error.txt
          git commit -m "chore: save build log [skip ci]" || true
          git push -f origin build-logs || true
